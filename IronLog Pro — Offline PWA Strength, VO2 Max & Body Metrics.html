    function handleCreateTemplate(e) {
      e.preventDefault();
      const name = document.getElementById('nt-name').value.trim();
      const category = document.getElementById('nt-cat').value;
      const checked = Array.from(document.querySelectorAll('input[name="nt-ex"]:checked')).map(c => c.value);
      if (!name || checked.length === 0) {
        showToast('Enter a name and select exercises.', 'error');
        return;
      }
      state.templates.unshift({
        id: 'tpl_' + Date.now(),
        name,
        category,
        exercises: checked.map(id => ({ exerciseId: id, defaultSets: 3, restSeconds: state.settings.defaultRestSeconds }))
      });
      saveTemplates();
      closeModal();
      renderCurrentTab();
      showToast('Routine saved!', 'success');
    }

    function deleteTemplate(id) {
      state.templates = state.templates.filter(t => t.id !== id);
      saveTemplates();
      renderCurrentTab();
    }

    // Finish / Discard / Rest Preset / Reset All Modals
    function openFinishWorkoutModal() {
      const vol = calculateWorkoutVolume(state.activeWorkout);
      openModal(`
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
          <h3 class="font-bold text-base text-white">Complete Workout</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-xl bg-slate-800 text-slate-400"><i class="ph-bold ph-x"></i></button>
        </div>
        <div class="p-4 space-y-4">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 flex items-center justify-between">
            <div>
              <div class="text-xs text-slate-400">Session Volume</div>
              <div class="font-mono text-xl font-extrabold text-emerald-400">${vol.toLocaleString()} ${state.settings.unit}</div>
            </div>
            <i class="ph-fill ph-trophy text-3xl text-amber-400"></i>
          </div>
          <textarea id="finish-notes" rows="3" placeholder="Session notes (energy, pump, RPE)..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white"></textarea>
          <div class="flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-800 text-slate-300 font-semibold text-xs">Keep Lifting</button>
            <button onclick="finishActiveWorkout(document.getElementById('finish-notes').value)" class="flex-1 py-3 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs">Save Workout</button>
          </div>
        </div>
      `);
    }

    function openDiscardWorkoutModal() {
      openModal(`
        <div class="p-5 text-center space-y-4">
          <h3 class="font-bold text-base text-white">Discard Active Workout?</h3>
          <p class="text-xs text-slate-400">Current uncompleted session sets will be lost.</p>
          <div class="flex gap-2.5">
            <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-200 font-semibold text-xs">Cancel</button>
            <button onclick="discardActiveWorkout()" class="flex-1 py-2.5 rounded-xl bg-rose-600 text-white font-bold text-xs">Discard</button>
          </div>
        </div>
      `);
    }

    function openRestPresetModal() {
      openModal(`
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
          <h3 class="font-bold text-base text-white">Quick Rest Timer</h3>
          <button onclick="closeModal()" class="p-1.5 rounded-xl bg-slate-800 text-slate-400"><i class="ph-bold ph-x"></i></button>
        </div>
        <div class="p-4 grid grid-cols-3 gap-2.5">
          ${[45, 60, 90, 120, 150, 180].map(sec => `
            <button onclick="startRestTimer(${sec}, 'Rest'); closeModal();" class="py-3 rounded-xl bg-slate-800 hover:bg-emerald-500/20 border border-slate-700 font-mono font-bold text-sm text-emerald-400">
              ${formatSecondsMMSS(sec)}
            </button>
          `).join('')}
        </div>
      `);
    }

    function openResetAllModal() {
      openModal(`
        <div class="p-5 text-center space-y-4">
          <h3 class="font-bold text-base text-white">Erase All Local Data?</h3>
          <p class="text-xs text-slate-400">Deletes all workouts, PRs, VO2 logs, and weight history from this browser.</p>
          <div class="flex gap-2.5">
            <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-200 font-semibold text-xs">Cancel</button>
            <button onclick="resetAllLocalData()" class="flex-1 py-2.5 rounded-xl bg-rose-600 text-white font-bold text-xs">Erase All</button>
          </div>
        </div>
      `);
    }

    window.addEventListener('resize', () => {
      if (state.currentTab === 'progress') {
        drawProgressChart();
        drawWeeklyVolumeChart();
      } else if (state.currentTab === 'body') {
        drawBodyWeightChart();
      }
    });

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
