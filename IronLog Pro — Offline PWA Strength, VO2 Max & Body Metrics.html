<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IronLog Pro">
  <link id="pwa-manifest-link" rel="manifest" href="">
  <link id="pwa-apple-icon" rel="apple-touch-icon" href="">
  <title>IronLog Pro — Strength, Conditioning & Body Metrics</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #090d16;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.35); }
      50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    }
    .pr-glow {
      animation: pulseGlow 2s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#090d16] text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">

  <!-- TOP STICKY HEADER -->
  <header class="sticky top-0 z-30 glass-panel border-b border-slate-800/90 px-4 py-3 pt-safe">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 via-teal-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-emerald-500/20 shrink-0">
          <i class="ph-bold ph-barbell text-slate-950 text-xl"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-extrabold text-lg tracking-tight leading-none flex items-center gap-1.5">
            Iron<span class="text-emerald-400">Log</span>
            <span class="text-[10px] font-mono uppercase tracking-wider px-1.5 py-0.5 rounded bg-slate-800 text-cyan-400 border border-slate-700">Pro</span>
          </h1>
          <p id="header-subtitle" class="text-xs text-slate-400 mt-0.5 truncate">Strength • VO2 Max • Kettlebell • Body</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <!-- Native PWA Install Button (Shown when Chrome fires beforeinstallprompt) -->
        <button id="header-install-btn" onclick="triggerNativePWAInstall()" class="hidden items-center gap-1.5 bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-500/40 text-cyan-300 font-bold text-xs px-3 py-1.5 rounded-xl transition active:scale-95">
          <i class="ph-bold ph-download-simple"></i>
          <span>Install App</span>
        </button>

        <!-- Active Workout Live Timer Badge -->
        <div id="active-session-header-controls" class="hidden flex items-center gap-2 shrink-0">
          <div class="flex items-center gap-1.5 bg-slate-800/90 border border-slate-700 px-2.5 py-1.5 rounded-xl">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="workout-duration-display" class="font-mono text-xs font-bold text-slate-200">00:00</span>
          </div>
          <button onclick="openFinishWorkoutModal()" class="bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-extrabold text-xs px-3.5 py-2 rounded-xl transition shadow-md shadow-emerald-500/25">
            Finish
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main id="app-content" class="flex-1 max-w-3xl w-full mx-auto px-4 pt-4 pb-36">
    <!-- Dynamic Tab Views Rendered Here -->
  </main>

  <!-- FLOATING SMART REST TIMER BAR -->
  <div id="rest-timer-bar" class="hidden fixed bottom-[68px] left-0 right-0 z-40 px-3 pb-2 pointer-events-none">
    <div class="max-w-3xl mx-auto pointer-events-auto bg-slate-900/95 border border-emerald-500/50 rounded-2xl p-3 shadow-2xl shadow-black/90 backdrop-blur-xl">
      <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-2.5">
        <div id="rest-progress-fill" class="h-full bg-gradient-to-r from-emerald-500 to-cyan-400 transition-all duration-300" style="width: 100%"></div>
      </div>
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0">
            <i class="ph-bold ph-timer text-xl"></i>
          </div>
          <div class="min-w-0">
            <div class="flex items-baseline gap-2">
              <span id="rest-time-display" class="font-mono text-2xl font-bold text-white leading-none">01:30</span>
              <span id="rest-exercise-label" class="text-[11px] text-slate-400 truncate">Rest Timer</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="adjustRestTime(-15)" class="px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-mono text-xs font-bold active:scale-95 transition">
            -15s
          </button>
          <button onclick="adjustRestTime(15)" class="px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-mono text-xs font-bold active:scale-95 transition">
            +15s
          </button>
          <button id="rest-pause-btn" onclick="toggleRestPause()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 active:scale-95 transition">
            <i id="rest-pause-icon" class="ph-bold ph-pause text-base"></i>
          </button>
          <button onclick="stopRestTimer()" class="px-3 py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 font-semibold text-xs active:scale-95 transition">
            Skip
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM 5-TAB NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 glass-panel border-t border-slate-800/90 pb-safe">
    <div class="max-w-3xl mx-auto grid grid-cols-5 h-16">
      <button onclick="switchTab('workout')" data-tab="workout" class="nav-btn flex flex-col items-center justify-center gap-1 text-emerald-400 transition">
        <i class="ph-fill ph-barbell text-xl"></i>
        <span class="text-[10px] font-semibold">Workout</span>
      </button>
      <button onclick="switchTab('conditioning')" data-tab="conditioning" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition">
        <i class="ph-bold ph-heartbeat text-xl"></i>
        <span class="text-[10px] font-medium">Conditioning</span>
      </button>
      <button onclick="switchTab('library')" data-tab="library" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition">
        <i class="ph-bold ph-books text-xl"></i>
        <span class="text-[10px] font-medium">Library</span>
      </button>
      <button onclick="switchTab('progress')" data-tab="progress" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition">
        <i class="ph-bold ph-trophy text-xl"></i>
        <span class="text-[10px] font-medium">Progress</span>
      </button>
      <button onclick="switchTab('body')" data-tab="body" class="nav-btn flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200 transition">
        <i class="ph-bold ph-scales text-xl"></i>
        <span class="text-[10px] font-medium">Body & Gear</span>
      </button>
    </div>
  </nav>

    <div id="modal-container" class="bg-[#111827] border border-slate-700/80 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- Modal content dynamically injected -->
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->

    /**
     * ============================================================================
     * SELF-CONTAINED PWA ENGINE (DYNAMIC CANVAS ICONS, MANIFEST & SERVICE WORKER)
     * ============================================================================
     */
    function generatePWAIconDataURL(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Rounded Obsidian Background
      const r = size * 0.22;
      ctx.fillStyle = '#090d16';
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();

      // Subtle Emerald/Cyan Radial Glow
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#10b981');
      grad.addColorStop(1, '#06b6d4');

      ctx.strokeStyle = 'rgba(16, 185, 129, 0.35)';
      ctx.lineWidth = size * 0.03;
      ctx.stroke();

      // Draw Barbell / Kettlebell Emblem
      ctx.fillStyle = grad;
      const centerY = size * 0.5;
      const barH = size * 0.07;
      ctx.fillRect(size * 0.2, centerY - barH / 2, size * 0.6, barH);

      // Inner & Outer Weight Plates
      const plateW = size * 0.065;
      const innerH = size * 0.38;
      const outerH = size * 0.26;
      const radius = size * 0.02;

      const drawPlate = (x, h) => {
        ctx.beginPath();
        ctx.roundRect(x, centerY - h / 2, plateW, h, radius);
        ctx.fill();
      };

      drawPlate(size * 0.26, innerH);
      drawPlate(size * 0.17, outerH);
      drawPlate(size * 0.675, innerH);
      drawPlate(size * 0.765, outerH);

      return canvas.toDataURL('image/png');
    }

    function initPWAFeatures() {
      try {
        // Detect if already running as installed standalone app
        state.pwa.isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;

        // 1. Generate dynamic 192x192 & 512x512 PNG icons
        const icon192 = generatePWAIconDataURL(192);
        const icon512 = generatePWAIconDataURL(512);

        const appleIconLink = document.getElementById('pwa-apple-icon');
        if (appleIconLink) appleIconLink.href = icon192;

        // 2. Build dynamic Web App Manifest Blob
        const manifestObj = {
          name: 'IronLog Pro — Workout & Conditioning',
          short_name: 'IronLog',
          description: 'Private offline strength, kettlebell, VO2 max, and body metrics tracker.',
          start_url: window.location.href,
          scope: './',
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#090d16',
          theme_color: '#090d16',
          icons: [
            { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        const manifestLink = document.getElementById('pwa-manifest-link');
        if (manifestLink) manifestLink.href = manifestURL;

        // 3. Register inline Service Worker for Offline Airplane Mode Caching
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
          const swCode = `
            const CACHE_NAME = 'ironlog-pwa-v1';
            self.addEventListener('install', (event) => {
              self.skipWaiting();
              event.waitUntil(
                caches.open(CACHE_NAME).then((cache) => {
                  return cache.addAll(['./', self.location.origin]).catch(() => {});
                })
              );
            });
            self.addEventListener('activate', (event) => {
              event.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', (event) => {
              if (event.request.method !== 'GET') return;
              event.respondWith(
                caches.match(event.request).then((cached) => {
                  const networkFetch = fetch(event.request).then((response) => {
                    if (response && response.status === 200) {
                      const clone = response.clone();
                      caches.open(CACHE_NAME).then((cache) => cache.put(event.request, clone));
                    }
                    return response;
                  }).catch(() => cached);
                  return cached || networkFetch;
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swURL = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swURL)
            .then(() => {
              state.pwa.swRegistered = true;
              state.pwa.offlineReady = true;
              if (state.currentTab === 'body') renderCurrentTab();
            })
            .catch(() => {
              // Blob SW may be restricted on some preview sandboxes; localStorage still works 100% offline
              state.pwa.swRegistered = false;
            });
        }

        // 4. Listen for Chrome's native Install Prompt event
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          state.pwa.deferredPrompt = e;
          updateInstallButtonsVisibility();
          if (state.currentTab === 'body') renderCurrentTab();
        });

        window.addEventListener('appinstalled', () => {
          state.pwa.deferredPrompt = null;
          state.pwa.isStandalone = true;
          updateInstallButtonsVisibility();
          showToast('IronLog Pro installed to your Home Screen!', 'success');
          if (state.currentTab === 'body') renderCurrentTab();
        });
      } catch (err) {
        console.warn('PWA init notice:', err);
      }
    }

    function updateInstallButtonsVisibility() {
      const headerBtn = document.getElementById('header-install-btn');
      if (!headerBtn) return;
      if (state.pwa.deferredPrompt && !state.pwa.isStandalone) {
        headerBtn.classList.remove('hidden');
        headerBtn.classList.add('flex');
      } else {
        headerBtn.classList.add('hidden');
        headerBtn.classList.remove('flex');
      }
    }

    async function triggerNativePWAInstall() {
      if (!state.pwa.deferredPrompt) {

      state.pwa.deferredPrompt.prompt();
      const { outcome } = await state.pwa.deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        state.pwa.deferredPrompt = null;
        updateInstallButtonsVisibility();
      }

    function loadFromStorage() {
      const savedSettings = localStorage.getItem(STORAGE_KEYS.SETTINGS);
      state.settings = savedSettings ? { ...DEFAULT_SETTINGS, ...JSON.parse(savedSettings) } : { ...DEFAULT_SETTINGS };

      const savedExercises = localStorage.getItem(STORAGE_KEYS.EXERCISES);
      state.exercises = savedExercises ? JSON.parse(savedExercises) : [...DEFAULT_EXERCISES];

      const savedTemplates = localStorage.getItem(STORAGE_KEYS.TEMPLATES);
      state.templates = savedTemplates ? JSON.parse(savedTemplates) : [...DEFAULT_TEMPLATES];

      const savedActive = localStorage.getItem(STORAGE_KEYS.ACTIVE);
      state.activeWorkout = savedActive ? JSON.parse(savedActive) : null;

      const savedHistory = localStorage.getItem(STORAGE_KEYS.HISTORY);
      const savedCond = localStorage.getItem(STORAGE_KEYS.CONDITIONING);
      const savedBody = localStorage.getItem(STORAGE_KEYS.BODY);

      if (savedHistory !== null) {
        state.history = JSON.parse(savedHistory);
        state.conditioningLogs = savedCond ? JSON.parse(savedCond) : [];
        state.bodyLogs = savedBody ? JSON.parse(savedBody) : [];
        state.hasSampleData = localStorage.getItem(STORAGE_KEYS.SAMPLE_FLAG) === 'true';
      } else {
        // Seed rich sample data so PRs, Smart Progression, VO2 Max, and BMI charts shine immediately
        const seeded = generateSampleDataset();
        state.history = seeded.history;
        state.conditioningLogs = seeded.conditioningLogs;
        state.bodyLogs = seeded.bodyLogs;
        state.hasSampleData = true;
        saveAllData();
        localStorage.setItem(STORAGE_KEYS.SAMPLE_FLAG, 'true');
      }
    }

    }

    /**
     * ============================================================================
     * WEB AUDIO API SOUND ENGINE (ZERO EXTERNAL AUDIO FILES)
     * ============================================================================
     */
    function playToneSequence(notes) {
      if (!state.settings.soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        notes.forEach(({ freq, delay, dur, type = 'sine', gain = 0.25 }) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now + delay);

          g.gain.setValueAtTime(0.001, now + delay);
          g.gain.exponentialRampToValueAtTime(gain, now + delay + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);

          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + dur);
        });
      } catch (e) {
        // Ignore browser autoplay block
      }
    }

    function playRestCompleteChime() {
      playToneSequence([
        { freq: 880, delay: 0, dur: 0.22 },
        { freq: 1318.5, delay: 0.16, dur: 0.42 }
      ]);
    }

    function playCountdownBeep() {
      playToneSequence([{ freq: 660, delay: 0, dur: 0.12, type: 'triangle', gain: 0.18 }]);
    }

    function playWorkGoChime() {
      playToneSequence([
        { freq: 587.33, delay: 0, dur: 0.12, type: 'sawtooth', gain: 0.2 },
        { freq: 880, delay: 0.12, dur: 0.14, type: 'sawtooth', gain: 0.22 },
        { freq: 1174.66, delay: 0.24, dur: 0.35, type: 'sine', gain: 0.28 }
      ]);
    }

    function playRecoveryChime() {
      playToneSequence([
        { freq: 783.99, delay: 0, dur: 0.2, gain: 0.22 },
        { freq: 523.25, delay: 0.18, dur: 0.35, gain: 0.22 }
      ]);
    }

    function playPRFanfare() {
      playToneSequence([
        { freq: 523.25, delay: 0, dur: 0.14, gain: 0.24 },
        { freq: 659.25, delay: 0.12, dur: 0.14, gain: 0.24 },
        { freq: 783.99, delay: 0.24, dur: 0.14, gain: 0.24 },
        { freq: 1046.5, delay: 0.36, dur: 0.45, gain: 0.3 }
      ]);
    }

    /**
     * ============================================================================
     * SMART PROGRESSION ENGINE & PR ANALYTICS
     * ============================================================================
     */
    function getExerciseById(id) {
      return state.exercises.find(e => e.id === id) || {
        id, name: 'Unknown Exercise', muscle: 'Other', secondary: '', equipment: '', targetRepRange: [8, 12], cues: '', alternatives: []
      };
    }

    function calculateEpley1RM(weight, reps) {
      const w = parseFloat(weight) || 0;
      const r = parseInt(reps, 10) || 0;
      if (w <= 0 || r <= 0) return 0;
      if (r === 1) return Math.round(w * 10) / 10;
      return Math.round(w * (1 + r / 30) * 10) / 10;
    }

    function getPreviousPerformance(exerciseId) {
      for (const workout of state.history) {
        const found = workout.exercises.find(ex => ex.exerciseId === exerciseId);
        if (found && found.sets && found.sets.length > 0) {
          const validSets = found.sets.filter(s => s.completed && ((parseFloat(s.weight) || 0) > 0 || (parseInt(s.reps, 10) || 0) > 0));
          if (validSets.length > 0) {
            return { date: workout.date, sets: validSets };
          }
        }
      }
      return null;
    }

    /**
     * Analyzes previous session using Double Progression logic and returns an actionable suggestion
     */
    function getSmartProgressionSuggestion(exerciseId) {
      const meta = getExerciseById(exerciseId);
      const prev = getPreviousPerformance(exerciseId);
      const unit = state.settings.unit;

      if (!prev || !prev.sets.length) {
        return {
          type: 'baseline',
          badge: 'Baseline Session',
          text: `Establish clean form for ${meta.targetRepRange ? meta.targetRepRange[0] + '–' + meta.targetRepRange[1] : '8–12'} ${meta.isTimed ? 'sec' : 'reps'} with 2 reps in reserve.`
        };
      }

      const [minTarget, maxTarget] = meta.targetRepRange || [8, 12];
      const topWeight = Math.max(...prev.sets.map(s => parseFloat(s.weight) || 0));
      const allHitMax = prev.sets.every(s => (parseInt(s.reps, 10) || 0) >= maxTarget);
      const avgReps = Math.round(prev.sets.reduce((acc, s) => acc + (parseInt(s.reps, 10) || 0), 0) / prev.sets.length);

      if (meta.isTimed) {
        if (allHitMax) {
          const inc = unit === 'lbs' ? 10 : 5;
          return {
            type: 'increase_weight',
            badge: 'Ready to Level Up',
            text: `Hit ${maxTarget}s on all sets last time! Add +${inc} ${unit} or extend hold +10s.`
          };
        }
        return {
          type: 'increase_reps',
          badge: 'Time Progression',
          text: `Last avg: ${avgReps}s @ ${topWeight} ${unit}. Aim for +5–10s per set toward ${maxTarget}s.`
        };
      }

      // Kettlebell increment logic (standard KB jumps are larger, e.g., 5-10 lbs / 2-4 kg)
      const isKB = meta.equipment === 'Kettlebell';
      const weightStep = isKB
        ? (unit === 'lbs' ? 5 : 2)
        : (unit === 'lbs' ? 5 : 2.5);

      if (allHitMax && topWeight > 0) {
        return {
          type: 'increase_weight',
          badge: 'Add Weight ↑',
          text: `Double Progression: Hit ${maxTarget}+ reps on all sets @ ${topWeight} ${unit} → Bump to ${topWeight + weightStep} ${unit}!`
        };
      }

      if (avgReps >= minTarget) {
        return {
          type: 'increase_reps',
          badge: 'Push Reps ↑',
          text: `Keep ${topWeight} ${unit} and aim for +1–2 reps/set (Goal: ${maxTarget} reps across all sets).`
        };
      }

      return {
        type: 'consolidate',
        badge: 'Consolidate Load',
        text: `Last avg ${avgReps} reps @ ${topWeight} ${unit}. Own ${minTarget}–${maxTarget} clean reps before adding weight.`
      };
    }

    /**
     * Computes 3 distinct PRs for an exercise: Heaviest Weight, Max Reps in a Set, and Best Estimated 1RM
     */
    function getExercisePRs(exerciseId) {
      let maxWeight = { val: 0, reps: 0, date: null };
      let maxReps = { val: 0, weight: 0, date: null };
      let best1RM = { val: 0, weight: 0, reps: 0, date: null };

      // Iterate oldest to newest so tie-breakers or progression dates are accurate
      const chronological = [...state.history].reverse();
      chronological.forEach(w => {
        const found = w.exercises.find(e => e.exerciseId === exerciseId);
        if (!found) return;
        found.sets.forEach(s => {
          if (!s.completed) return;
          const wt = parseFloat(s.weight) || 0;
          const rp = parseInt(s.reps, 10) || 0;
          const e1rm = calculateEpley1RM(wt, rp);

          if (wt > maxWeight.val || (wt === maxWeight.val && rp > maxWeight.reps)) {
            maxWeight = { val: wt, reps: rp, date: w.date };
          }
          if (rp > maxReps.val || (rp === maxReps.val && wt > maxReps.weight)) {
            maxReps = { val: rp, weight: wt, date: w.date };
          }
          if (e1rm > best1RM.val) {
            best1RM = { val: e1rm, weight: wt, reps: rp, date: w.date };
          }
        });
      });

      return { maxWeight, maxReps, best1RM };
    }

    /**
     * ============================================================================
     * REST TIMER ENGINE (STRENGTH WORKOUTS)
     * ============================================================================
     */
    function startRestTimer(seconds, exerciseName = 'Rest') {
      stopRestTimer(false);
      const duration = Math.max(5, parseInt(seconds, 10) || state.settings.defaultRestSeconds);
      state.restTimer = {
        active: true,
        paused: false,
        totalSeconds: duration,
        remainingSeconds: duration,
        exerciseName,
        intervalId: setInterval(tickRestTimer, 1000)
      };
      updateRestTimerUI();
    }

    function tickRestTimer() {
      if (!state.restTimer.active || state.restTimer.paused) return;
      state.restTimer.remainingSeconds -= 1;
      if (state.restTimer.remainingSeconds <= 3 && state.restTimer.remainingSeconds > 0) {
        playCountdownBeep();
      }
      if (state.restTimer.remainingSeconds <= 0) {
        playRestCompleteChime();
        showToast('Rest complete! Time for your next set.', 'success');
        stopRestTimer(true);
      } else {
        updateRestTimerUI();
      }
    }

    function adjustRestTime(delta) {
      if (!state.restTimer.active) return;
      state.restTimer.remainingSeconds = Math.max(5, state.restTimer.remainingSeconds + delta);
      if (state.restTimer.remainingSeconds > state.restTimer.totalSeconds) {
        state.restTimer.totalSeconds = state.restTimer.remainingSeconds;
      }
      updateRestTimerUI();
    }

    function toggleRestPause() {
      if (!state.restTimer.active) return;
      state.restTimer.paused = !state.restTimer.paused;
      updateRestTimerUI();
    }

    function stopRestTimer(hideUI = true) {
      if (state.restTimer.intervalId) clearInterval(state.restTimer.intervalId);
      state.restTimer.active = false;
      state.restTimer.paused = false;
      state.restTimer.intervalId = null;
      if (hideUI) document.getElementById('rest-timer-bar').classList.add('hidden');
    }

    function updateRestTimerUI() {
      const bar = document.getElementById('rest-timer-bar');
      if (!state.restTimer.active) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      document.getElementById('rest-time-display').textContent = formatSecondsMMSS(state.restTimer.remainingSeconds);
      document.getElementById('rest-exercise-label').textContent = state.restTimer.exerciseName;
      const pct = Math.min(100, Math.max(0, (state.restTimer.remainingSeconds / state.restTimer.totalSeconds) * 100));
      document.getElementById('rest-progress-fill').style.width = `${pct}%`;
      document.getElementById('rest-pause-icon').className = state.restTimer.paused ? 'ph-bold ph-play text-base' : 'ph-bold ph-pause text-base';
    }

    function formatSecondsMMSS(totalSec) {
      const secInt = Math.max(0, Math.floor(totalSec));
      const h = Math.floor(secInt / 3600);
      const m = Math.floor((secInt % 3600) / 60);
      const s = secInt % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatDateShort(isoStr) {
      if (!isoStr) return '—';
      const d = new Date(isoStr);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function calculateWorkoutVolume(workout) {
      let total = 0;
      workout.exercises.forEach(ex => {
        ex.sets.forEach(s => {
          if (s.completed) {
            total += (parseFloat(s.weight) || 0) * (parseInt(s.reps, 10) || 0);
          }
        });
      });
      return Math.round(total);
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-950/95 border-emerald-500/70 text-emerald-100',
        pr: 'bg-amber-950/95 border-amber-400 text-amber-100 pr-glow',
        error: 'bg-rose-950/95 border-rose-500/70 text-rose-100',
        info: 'bg-slate-900/95 border-cyan-500/50 text-slate-100'
      };
      const icon = type === 'pr' ? 'ph-fill ph-trophy text-amber-400' :
                   type === 'success' ? 'ph-bold ph-check-circle text-emerald-400' :
                   type === 'error' ? 'ph-bold ph-warning-circle text-rose-400' : 'ph-bold ph-info text-cyan-400';

      toast.className = `flex items-center gap-2.5 px-4 py-3 rounded-2xl border shadow-2xl backdrop-blur-md text-xs font-semibold transition-all duration-300 ${colors[type] || colors.info}`;
      toast.innerHTML = `<i class="${icon} text-lg shrink-0"></i><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, type === 'pr' ? 4000 : 2800);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function startWorkoutFromTemplate(templateId) {
      const tpl = state.templates.find(t => t.id === templateId);
      if (!tpl) return;

      const exercises = tpl.exercises.map(item => {
        const prev = getPreviousPerformance(item.exerciseId);
        const count = item.defaultSets || 3;
        const sets = [];
        for (let i = 0; i < count; i++) {
          const prevSet = prev && prev.sets[i] ? prev.sets[i] : (prev && prev.sets[prev.sets.length - 1] ? prev.sets[prev.sets.length - 1] : null);
          sets.push({
            weight: prevSet ? prevSet.weight : '',
            reps: prevSet ? prevSet.reps : '',
            rpe: '',
            completed: false,
            isPR: false
          });
        }
        return {
          uid: 'exu_' + Math.random().toString(36).slice(2, 9),
          exerciseId: item.exerciseId,
          restSeconds: item.restSeconds || state.settings.defaultRestSeconds,
          sets
        };
      });

      state.activeWorkout = {
        id: 'w_' + Date.now(),
        name: tpl.name,
        startTime: Date.now(),
        notes: '',
        exercises
      };
      saveActiveWorkout();
      updateHeaderState();
      startWorkoutElapsedTicker();
      renderCurrentTab();
      showToast(`Started "${tpl.name}"`, 'success');
    }

            <div class="flex items-center justify-between gap-2 mb-3">
              <input
                type="text"
                value="${escapeHtml(w.name)}"
                onchange="updateWorkoutName(this.value)"
                class="bg-transparent font-extrabold text-lg text-white focus:outline-none focus:border-b focus:border-emerald-500 w-full"
                placeholder="Workout Name"
              />
              <button onclick="openRestPresetModal()" class="shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-semibold border border-slate-700 transition">
                <i class="ph-bold ph-timer"></i> Timer
              </button>
            </div>

            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800/80 text-center">
              <div class="bg-slate-900/80 rounded-xl py-2 px-1">
                <div class="text-[10px] uppercase tracking-wider text-slate-400">Volume</div>
                <div class="font-mono font-bold text-sm text-emerald-400">${Math.round(liveVolume).toLocaleString()} <span class="text-[10px]">${unit}</span></div>
              </div>
              <div class="bg-slate-900/80 rounded-xl py-2 px-1">
                <div class="text-[10px] uppercase tracking-wider text-slate-400">Sets Done</div>
                <div class="font-mono font-bold text-sm text-white">${completedSetsCount} / ${totalSetsCount}</div>
              </div>
              <div class="bg-slate-900/80 rounded-xl py-2 px-1">
                <div class="text-[10px] uppercase tracking-wider text-slate-400">Auto-Rest</div>
                <button onclick="toggleAutoRestQuick()" class="font-mono font-bold text-xs ${state.settings.autoStartRest ? 'text-cyan-400' : 'text-slate-500'}">
                  ${state.settings.autoStartRest ? 'ON' : 'OFF'}
                </button>
              </div>
            </div>
          </div>

          <!-- Exercise Cards -->
          ${w.exercises.length === 0 ? `
            <div class="bg-[#111827]/60 border border-dashed border-slate-700 rounded-3xl p-8 text-center">
              <i class="ph-bold ph-barbell text-3xl text-slate-500 mb-2"></i>
              <p class="text-sm font-semibold text-slate-300 mb-1">No exercises in this session yet</p>
              <p class="text-xs text-slate-400">Add strength movements, kettlebell exercises, or firefighter conditioning work below.</p>
            </div>
          ` : w.exercises.map(exItem => {
            const exMeta = getExerciseById(exItem.exerciseId);
            const prevPerf = getPreviousPerformance(exItem.exerciseId);
            const prog = getSmartProgressionSuggestion(exItem.exerciseId);
            const isKB = exMeta.equipment === 'Kettlebell';

            const progStyle = prog.type === 'increase_weight'
              ? 'bg-emerald-950/60 border-emerald-500/40 text-emerald-200'
              : prog.type === 'increase_reps'
              ? 'bg-cyan-950/60 border-cyan-500/40 text-cyan-200'
              : 'bg-slate-900/90 border-slate-700/80 text-slate-300';

            return `
              <div class="bg-[#111827] border border-slate-800 rounded-2xl overflow-hidden shadow-md">
                <!-- Exercise Header -->
                <div class="p-3.5 bg-slate-800/40 border-b border-slate-800">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <div class="flex flex-wrap items-center gap-1.5">
                        <h3 class="font-bold text-sm sm:text-base text-emerald-400">${escapeHtml(exMeta.name)}</h3>
                        <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">${exMeta.equipment}</span>
                      </div>
                      <div class="flex flex-wrap items-center gap-2 mt-1.5">
                        <button onclick="cycleExerciseRest('${exItem.uid}')" class="inline-flex items-center gap-1 text-[11px] font-mono text-cyan-400 hover:text-cyan-300 bg-cyan-950/40 border border-cyan-500/25 px-2 py-0.5 rounded-md transition">
                          <i class="ph-bold ph-timer"></i> Rest: ${formatSecondsMMSS(exItem.restSeconds)}
                        </button>
                        ${isKB ? `
                          <button onclick="openKBPresetModal('${exItem.uid}')" class="inline-flex items-center gap-1 text-[11px] font-mono text-purple-300 bg-purple-950/50 border border-purple-500/30 px-2 py-0.5 rounded-md transition">
                            <i class="ph-bold ph-kettlebell"></i> KB Weights
                          </button>
                        ` : ''}
                        ${exMeta.alternatives && exMeta.alternatives.length ? `
                          <button onclick="openSwapExerciseModal('${exItem.uid}')" class="inline-flex items-center gap-1 text-[11px] text-slate-300 hover:text-white bg-slate-800 border border-slate-700 px-2 py-0.5 rounded-md transition">
                            <i class="ph-bold ph-arrows-left-right"></i> Swap
                          </button>
                        ` : ''}
                      </div>
                    </div>
                    <button onclick="removeExerciseFromWorkout('${exItem.uid}')" class="p-2 text-slate-500 hover:text-rose-400 rounded-xl hover:bg-slate-800 transition">
                      <i class="ph-bold ph-trash text-base"></i>
                    </button>
                  </div>

                  <!-- Smart Progression Banner -->
                  <div class="mt-2.5 px-3 py-2 rounded-xl border text-[11px] flex items-start gap-2 ${progStyle}">
                    <i class="ph-bold ph-trend-up text-sm shrink-0 mt-0.5 text-emerald-400"></i>
                    <div>
                      <span class="font-bold uppercase tracking-wider text-[10px] mr-1.5">[${prog.badge}]</span>
                      <span>${escapeHtml(prog.text)}</span>
                    </div>
                  </div>
                </div>

                <!-- Set Columns Header -->
                <div class="grid grid-cols-12 gap-1.5 px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800/60 text-center">
                  <div class="col-span-1">Set</div>
                  <div class="col-span-3">Previous</div>
                  <div class="col-span-3">${unit}</div>
                  <div class="col-span-2">${exMeta.isTimed ? 'Sec' : 'Reps'}</div>
                  <div class="col-span-2">RPE</div>
                  <div class="col-span-1">✓</div>
                </div>

                <!-- Sets List -->
                <div class="divide-y divide-slate-800/50">
                  ${exItem.sets.map((set, setIdx) => {
                    const prevSet = prevPerf && prevPerf.sets[setIdx] ? prevPerf.sets[setIdx] : null;
                    const prevText = prevSet ? `${prevSet.weight}×${prevSet.reps}${exMeta.isTimed ? 's' : ''}` : '—';
                    const rowBg = set.completed ? (set.isPR ? 'bg-amber-950/30' : 'bg-emerald-950/25') : '';

                    return `
                      <div class="grid grid-cols-12 gap-1.5 px-3 py-2 items-center transition ${rowBg}">
                        <div class="col-span-1 text-center">
                          <button onclick="removeSet('${exItem.uid}', ${setIdx})" class="w-6 h-6 rounded-lg font-mono text-xs font-bold ${set.completed ? 'text-emerald-400' : 'text-slate-300'} hover:bg-rose-500/20 hover:text-rose-400 transition" title="Remove set">
                            ${set.isPR ? '🏆' : setIdx + 1}
                          </button>
                        </div>

                        <div class="col-span-3 text-center">
                          <button
                            onclick="autofillFromPrevious('${exItem.uid}', ${setIdx}, '${prevSet ? prevSet.weight : ''}', '${prevSet ? prevSet.reps : ''}')"
                            class="text-[11px] font-mono text-slate-400 hover:text-cyan-300 truncate max-w-full px-1 py-1 rounded hover:bg-slate-800 transition"
                            title="Tap to copy previous set"
                          >
                            ${prevText}
                          </button>
                        </div>

                        <div class="col-span-3">
                          <input
                            type="number"
                            inputmode="decimal"
                            step="any"
                            placeholder="${prevSet ? prevSet.weight : '0'}"
                            value="${set.weight}"
                            onchange="updateSetField('${exItem.uid}', ${setIdx}, 'weight', this.value)"
                            class="w-full bg-slate-900 border ${set.completed ? 'border-emerald-500/40 text-emerald-200' : 'border-slate-700 text-white'} rounded-xl py-1.5 px-1 text-center font-mono text-sm font-bold focus:outline-none focus:border-emerald-500"
                          />
                        </div>

                        <div class="col-span-2">
                          <input
                            type="number"
                            inputmode="numeric"
                            placeholder="${prevSet ? prevSet.reps : '0'}"
                            value="${set.reps}"
                            onchange="updateSetField('${exItem.uid}', ${setIdx}, 'reps', this.value)"
                            class="w-full bg-slate-900 border ${set.completed ? 'border-emerald-500/40 text-emerald-200' : 'border-slate-700 text-white'} rounded-xl py-1.5 px-1 text-center font-mono text-sm font-bold focus:outline-none focus:border-emerald-500"
                          />
                        </div>

                        <div class="col-span-2">
                          <input
                            type="text"
                            placeholder="8.5"
                            value="${escapeHtml(set.rpe || '')}"
                            onchange="updateSetField('${exItem.uid}', ${setIdx}, 'rpe', this.value)"
                            class="w-full bg-slate-900/70 border border-slate-800 text-slate-300 rounded-xl py-1.5 px-1 text-center text-xs focus:outline-none focus:border-cyan-500"
                          />
                        </div>

                        <div class="col-span-1 flex justify-center">
                          <button
                            onclick="toggleSetComplete('${exItem.uid}', ${setIdx})"
                            class="w-8 h-8 rounded-xl flex items-center justify-center transition active:scale-90 ${
                              set.completed
                                ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/30'
                                : 'bg-slate-800 text-slate-400 hover:bg-slate-700 border border-slate-700'
                            }"
                          >
                            <i class="ph-bold ph-check text-sm"></i>
                          </button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>

                <!-- Add Set Footer -->
                <div class="p-2.5 bg-slate-900/40 border-t border-slate-800/60">
                  <button onclick="addSetToExercise('${exItem.uid}')" class="w-full py-2 rounded-xl bg-slate-800/80 hover:bg-slate-800 text-slate-300 hover:text-white text-xs font-semibold flex items-center justify-center gap-1.5 transition">
                    <i class="ph-bold ph-plus"></i> Add Set
                  </button>
                </div>
              </div>
            `;
          }).join('')}

          <!-- Bottom Actions -->
          <div class="space-y-2.5 pt-1">
            <button onclick="openExercisePickerModal()" class="w-full py-3.5 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 font-bold text-sm flex items-center justify-center gap-2 transition active:scale-[0.99]">
              <i class="ph-bold ph-plus-circle text-lg"></i>
              Add Exercise
            </button>

            <button onclick="openDiscardWorkoutModal()" class="w-full py-2.5 px-4 rounded-xl text-rose-400/80 hover:text-rose-400 hover:bg-rose-950/30 text-xs font-semibold transition">
              Cancel & Discard Workout
            </button>
          </div>
        </div>
      `;
    }

    function updateWorkoutName(val) {
      if (!state.activeWorkout) return;
      state.activeWorkout.name = val.trim() || 'Workout';
      saveActiveWorkout();
      updateHeaderState();
    }

    function toggleAutoRestQuick() {
      state.settings.autoStartRest = !state.settings.autoStartRest;
      saveSettings();
      renderCurrentTab();
      showToast(`Auto-rest timer ${state.settings.autoStartRest ? 'ON' : 'OFF'}`);
    }

    function addExerciseToActiveWorkout(exerciseId) {
      if (!state.activeWorkout) {
        state.activeWorkout = {
          id: 'w_' + Date.now(),
          name: 'Custom Workout',
          startTime: Date.now(),
          notes: '',
          exercises: []
        };
        startWorkoutElapsedTicker();
      }

      const prev = getPreviousPerformance(exerciseId);
      const firstPrev = prev && prev.sets[0] ? prev.sets[0] : null;

      state.activeWorkout.exercises.push({
        uid: 'exu_' + Math.random().toString(36).slice(2, 9),
        exerciseId,
        restSeconds: state.settings.defaultRestSeconds,
        sets: [
          {
            weight: firstPrev ? firstPrev.weight : '',
            reps: firstPrev ? firstPrev.reps : '',
            rpe: '',
            completed: false,
            isPR: false
          }
        ]
      });
      saveActiveWorkout();
      updateHeaderState();
      closeModal();
      switchTab('workout');
      showToast(`Added ${getExerciseById(exerciseId).name}`, 'success');
    }

    function swapExerciseInActiveWorkout(uid, newExerciseId) {
      const exItem = state.activeWorkout?.exercises.find(e => e.uid === uid);
      if (!exItem) return;
      exItem.exerciseId = newExerciseId;
      exItem.sets.forEach(s => { s.isPR = false; });
      saveActiveWorkout();
      closeModal();
      renderCurrentTab();
      showToast(`Swapped to ${getExerciseById(newExerciseId).name}`, 'info');
    }

    function applyKBWeightToExercise(uid, weightVal) {
      const exItem = state.activeWorkout?.exercises.find(e => e.uid === uid);
      if (!exItem) return;
      exItem.sets.forEach(s => {
        if (!s.completed) s.weight = weightVal;
      });
      saveActiveWorkout();
      closeModal();
      renderCurrentTab();
      showToast(`Set kettlebell load to ${weightVal} ${state.settings.unit}`);
    }

    function removeExerciseFromWorkout(uid) {
      if (!state.activeWorkout) return;
      state.activeWorkout.exercises = state.activeWorkout.exercises.filter(e => e.uid !== uid);
      saveActiveWorkout();
      renderCurrentTab();
    }

    function addSetToExercise(uid) {
      const ex = state.activeWorkout?.exercises.find(e => e.uid === uid);
      if (!ex) return;
      const lastSet = ex.sets[ex.sets.length - 1];
      const prev = getPreviousPerformance(ex.exerciseId);
      const prevMatch = prev && prev.sets[ex.sets.length] ? prev.sets[ex.sets.length] : null;

      ex.sets.push({
        weight: prevMatch ? prevMatch.weight : (lastSet ? lastSet.weight : ''),
        reps: prevMatch ? prevMatch.reps : (lastSet ? lastSet.reps : ''),
        rpe: '',
        completed: false,
        isPR: false
      });
      saveActiveWorkout();
      renderCurrentTab();
    }

    function removeSet(uid, setIdx) {
      const ex = state.activeWorkout?.exercises.find(e => e.uid === uid);
      if (!ex || ex.sets.length <= 1) {
        showToast('Keep at least 1 set.', 'info');
        return;
      }
      ex.sets.splice(setIdx, 1);
      saveActiveWorkout();
      renderCurrentTab();
    }

    function updateSetField(uid, setIdx, field, value) {
      const ex = state.activeWorkout?.exercises.find(e => e.uid === uid);
      if (!ex || !ex.sets[setIdx]) return;
      ex.sets[setIdx][field] = value;
      saveActiveWorkout();
    }

    function autofillFromPrevious(uid, setIdx, weight, reps) {
      if (!weight && !reps) return;
      const ex = state.activeWorkout?.exercises.find(e => e.uid === uid);
      if (!ex || !ex.sets[setIdx]) return;
      ex.sets[setIdx].weight = weight;
      ex.sets[setIdx].reps = reps;
      saveActiveWorkout();
      renderCurrentTab();
      showToast('Copied previous set values');
    }

    function toggleSetComplete(uid, setIdx) {
      const ex = state.activeWorkout?.exercises.find(e => e.uid === uid);
      if (!ex || !ex.sets[setIdx]) return;
      const set = ex.sets[setIdx];

      if (!set.completed) {
        const prev = getPreviousPerformance(ex.exerciseId);
        const prevSet = prev && prev.sets[setIdx] ? prev.sets[setIdx] : null;
        if (set.weight === '' && prevSet) set.weight = prevSet.weight;
        if (set.reps === '' && prevSet) set.reps = prevSet.reps;
      }

      set.completed = !set.completed;

      // Live PR Detection when checking off a set!
      if (set.completed) {
        const wt = parseFloat(set.weight) || 0;
        const rp = parseInt(set.reps, 10) || 0;
        const e1rm = calculateEpley1RM(wt, rp);
        const historicPRs = getExercisePRs(ex.exerciseId);

        const beatWeight = wt > 0 && historicPRs.maxWeight.val > 0 && wt > historicPRs.maxWeight.val;
        const beat1RM = e1rm > 0 && historicPRs.best1RM.val > 0 && e1rm > historicPRs.best1RM.val;
        const beatReps = rp > 0 && historicPRs.maxReps.val > 0 && rp > historicPRs.maxReps.val;

        if (beatWeight || beat1RM || beatReps) {
          set.isPR = true;
          const exMeta = getExerciseById(ex.exerciseId);
          const prReason = beatWeight ? `Heaviest Weight (${wt} ${state.settings.unit})` :
                           beat1RM ? `Est. 1RM (${e1rm} ${state.settings.unit})` :
                           `Max Reps (${rp})`;
          playPRFanfare();
          showToast(`NEW PR on ${exMeta.name}: ${prReason}!`, 'pr');
        } else {
          set.isPR = false;
        }
      } else {
        set.isPR = false;
      }

      saveActiveWorkout();
      renderCurrentTab();

      if (set.completed && state.settings.autoStartRest) {
        const exMeta = getExerciseById(ex.exerciseId);
        startRestTimer(ex.restSeconds || state.settings.defaultRestSeconds, exMeta.name);
      }
    }

    function cycleExerciseRest(uid) {
      const ex = state.activeWorkout?.exercises.find(e => e.uid === uid);
      if (!ex) return;
      const presets = [45, 60, 75, 90, 120, 150, 180];
      const idx = presets.indexOf(ex.restSeconds);
      ex.restSeconds = presets[(idx + 1) % presets.length];
      saveActiveWorkout();
      renderCurrentTab();
    }

    function finishActiveWorkout(notes = '') {
      if (!state.activeWorkout) return;
      const durationSeconds = Math.max(60, Math.floor((Date.now() - state.activeWorkout.startTime) / 1000));

      const cleanedExercises = state.activeWorkout.exercises
        .map(ex => ({
          exerciseId: ex.exerciseId,
          restSeconds: ex.restSeconds,
          sets: ex.sets.filter(s => s.completed)
        }))
        .filter(ex => ex.sets.length > 0);

      if (cleanedExercises.length === 0) {
        showToast('Check off at least one set before finishing!', 'error');
        return;
      }

      const completedRecord = {
        id: state.activeWorkout.id,
        name: state.activeWorkout.name,
        date: new Date().toISOString(),
        durationSeconds,
        notes: notes.trim(),
        exercises: cleanedExercises
      };

      state.history.unshift(completedRecord);
      saveHistory();

      state.activeWorkout = null;
      saveActiveWorkout();
      stopRestTimer(true);
      if (state.workoutTimerInterval) clearInterval(state.workoutTimerInterval);

      closeModal();
      updateHeaderState();
      switchTab('progress');
      showToast('Workout saved & PR analytics updated!', 'success');
    }

    function discardActiveWorkout() {
      state.activeWorkout = null;
      saveActiveWorkout();
      stopRestTimer(true);
      if (state.workoutTimerInterval) clearInterval(state.workoutTimerInterval);
      closeModal();
      updateHeaderState();
      renderCurrentTab();
      showToast('Workout discarded.');
    }

    /**
     * ============================================================================
     * TAB 2: VO2 MAX TRAINER & KETTLEBELL CONDITIONING
     * ============================================================================
     */
    function renderConditioningView() {
      const ct = state.condTimer;
      const maxHR = 220 - (parseInt(state.settings.age, 10) || 32);
      const restHR = parseInt(state.settings.restingHR, 10) || 60;
      const hrr = maxHR - restHR;
      // Karvonen HR Reserve Zones
      const zone2Low = Math.round(restHR + hrr * 0.60);
      const zone2High = Math.round(restHR + hrr * 0.70);
      const vo2Low = Math.round(restHR + hrr * 0.85);
      const vo2High = Math.round(restHR + hrr * 0.95);

      // Weekly conditioning minutes
      const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
      const weeklyMins = Math.round(
        state.conditioningLogs
          .filter(c => new Date(c.date).getTime() >= weekAgo)
          .reduce((sum, c) => sum + (c.durationSeconds || 0), 0) / 60
      );
      const latestVO2 = state.conditioningLogs.find(c => c.estimatedVO2)?.estimatedVO2 || '—';

      const phaseBadgeColors = {
        READY: 'bg-slate-800 text-slate-300 border-slate-700',
        WARMUP: 'bg-amber-950/70 text-amber-300 border-amber-500/40',
        WORK: 'bg-emerald-950/80 text-emerald-300 border-emerald-500/50',
        REST: 'bg-cyan-950/80 text-cyan-300 border-cyan-500/50',
        COOLDOWN: 'bg-purple-950/70 text-purple-300 border-purple-500/40',
        DONE: 'bg-emerald-500 text-slate-950 border-emerald-400'
      };

      const ringColor = ct.phase === 'WORK' ? '#10b981' :
                        ct.phase === 'REST' ? '#06b6d4' :
                        ct.phase === 'WARMUP' ? '#f59e0b' : '#8b5cf6';

      const progressPct = ct.phaseTotalSec > 0 ? Math.min(100, Math.max(0, (ct.phaseRemainingSec / ct.phaseTotalSec) * 100)) : 100;
      const radius = 78;
      const circumference = 2 * Math.PI * radius;
      const dashOffset = circumference - (progressPct / 100) * circumference;

      return `
        <div class="space-y-5">
          <!-- Weekly Conditioning & VO2 Max Summary -->
          <div class="grid grid-cols-3 gap-2.5">
            <div class="bg-[#111827] border border-slate-800 rounded-2xl p-3 text-center">
              <div class="text-[10px] uppercase tracking-wider text-slate-400">7-Day Cardio</div>
              <div class="font-mono text-lg font-extrabold text-emerald-400 mt-0.5">${weeklyMins} <span class="text-xs font-normal">min</span></div>
            </div>
            <div class="bg-[#111827] border border-slate-800 rounded-2xl p-3 text-center">
              <div class="text-[10px] uppercase tracking-wider text-slate-400">Est. VO2 Max</div>
              <div class="font-mono text-lg font-extrabold text-cyan-400 mt-0.5">${latestVO2}</div>
            </div>
            <div class="bg-[#111827] border border-slate-800 rounded-2xl p-3 text-center">
              <div class="text-[10px] uppercase tracking-wider text-slate-400">VO2 HR Target</div>
              <div class="font-mono text-sm font-extrabold text-rose-400 mt-1">${vo2Low}–${vo2High}</div>
            </div>
          </div>

          <!-- Interactive Interval / VO2 Max / EMOM Timer Card -->
          <div class="bg-gradient-to-b from-[#111827] to-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
            <div class="flex items-center justify-between gap-2 mb-3">
              <div>
                <span class="px-2.5 py-0.5 rounded-lg border text-[10px] font-mono font-bold uppercase tracking-wider ${phaseBadgeColors[ct.phase] || phaseBadgeColors.READY}">
                  ${ct.phase}
                </span>
                <h2 class="font-extrabold text-base text-white mt-1.5">${escapeHtml(ct.protocolTitle)}</h2>
              </div>
              <div class="text-right font-mono">
                <div class="text-xs text-slate-400">Round</div>
                <div class="text-base font-extrabold text-white">${ct.currentRound} / ${ct.totalRounds}</div>
              </div>
            </div>

            <!-- SVG Circular Phase Timer -->
            <div class="relative flex items-center justify-center my-4">
              <svg class="w-48 h-48 -rotate-90" viewBox="0 0 180 180">
                <circle cx="90" cy="90" r="${radius}" stroke="#1e293b" stroke-width="10" fill="none" />
                <circle
                  cx="90" cy="90" r="${radius}"
                  stroke="${ringColor}"
                  stroke-width="10"
                  stroke-linecap="round"
                  fill="none"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${dashOffset}"
                  style="transition: stroke-dashoffset 0.35s linear, stroke 0.3s ease;"
                />
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span class="font-mono text-4xl font-extrabold text-white tracking-tight">${formatSecondsMMSS(ct.phaseRemainingSec)}</span>
                <span class="text-[11px] font-semibold uppercase tracking-widest text-slate-400 mt-1">
                  ${ct.phase === 'WORK' ? 'MAX EFFORT' : ct.phase === 'REST' ? 'ACTIVE RECOVERY' : ct.phase}
                </span>
              </div>
            </div>

            <!-- Kettlebell / Interval Rep Tally Counter -->

    function loadConditioningProtocol(protocolId) {
      const p = CONDITIONING_PROTOCOLS.find(item => item.id === protocolId);
      if (!p) return;
      stopConditioningInterval();
      const firstPhase = p.warmupSec > 0 ? 'WARMUP' : 'WORK';
      const firstSec = p.warmupSec > 0 ? p.warmupSec : p.workSec;

      state.condTimer = {
        active: false,
        paused: false,
        protocolTitle: p.title,
        phase: firstPhase,
        currentRound: 1,
        totalRounds: p.rounds,
        phaseTotalSec: firstSec,
        phaseRemainingSec: firstSec,
        warmupSec: p.warmupSec,
        workSec: p.workSec,
        restSec: p.restSec,
        cooldownSec: p.cooldownSec,
        elapsedTotalSec: 0,
        repCounter: 0,
        intervalId: null
      };
      renderCurrentTab();
      showToast(`Loaded "${p.title}"`, 'info');
    }

    function startConditioningTimer() {
      const ct = state.condTimer;
      if (ct.phase === 'READY' || ct.phase === 'DONE') {
        ct.phase = ct.warmupSec > 0 ? 'WARMUP' : 'WORK';
        ct.phaseTotalSec = ct.warmupSec > 0 ? ct.warmupSec : ct.workSec;
        ct.phaseRemainingSec = ct.phaseTotalSec;
        ct.currentRound = 1;
        ct.elapsedTotalSec = 0;
      }
      ct.active = true;
      ct.paused = false;
      if (ct.phase === 'WORK') playWorkGoChime();
      stopConditioningInterval();
      ct.intervalId = setInterval(tickConditioningTimer, 1000);
      renderCurrentTab();
    }

    function toggleConditioningPause() {
      state.condTimer.paused = !state.condTimer.paused;
      renderCurrentTab();
    }

    function resetConditioningTimer() {
      stopConditioningInterval();
      const ct = state.condTimer;
      ct.active = false;
      ct.paused = false;
      ct.phase = ct.warmupSec > 0 ? 'WARMUP' : 'WORK';
      ct.currentRound = 1;
      ct.phaseTotalSec = ct.warmupSec > 0 ? ct.warmupSec : ct.workSec;
      ct.phaseRemainingSec = ct.phaseTotalSec;
      ct.elapsedTotalSec = 0;
      ct.repCounter = 0;
      renderCurrentTab();
    }

    function stopConditioningInterval() {
      if (state.condTimer.intervalId) {
        clearInterval(state.condTimer.intervalId);
        state.condTimer.intervalId = null;
      }
    }

    function adjustCondReps(delta) {
      state.condTimer.repCounter = Math.max(0, state.condTimer.repCounter + delta);
      renderCurrentTab();
    }

    function tickConditioningTimer() {
      const ct = state.condTimer;
      if (!ct.active || ct.paused) return;

      ct.elapsedTotalSec += 1;
      ct.phaseRemainingSec -= 1;

      if (ct.phaseRemainingSec <= 3 && ct.phaseRemainingSec > 0) {
        playCountdownBeep();
      }

      if (ct.phaseRemainingSec <= 0) {
        // Transition to next phase
        if (ct.phase === 'WARMUP') {
          ct.phase = 'WORK';
          ct.phaseTotalSec = ct.workSec;
          ct.phaseRemainingSec = ct.workSec;
          playWorkGoChime();
          showToast(`Round 1/${ct.totalRounds}: WORK!`, 'success');
        } else if (ct.phase === 'WORK') {
          if (ct.restSec > 0 && ct.currentRound < ct.totalRounds) {
            ct.phase = 'REST';
            ct.phaseTotalSec = ct.restSec;
            ct.phaseRemainingSec = ct.restSec;
            playRecoveryChime();
            showToast('Active Recovery', 'info');
          } else if (ct.currentRound < ct.totalRounds) {
            ct.currentRound += 1;
            ct.phaseTotalSec = ct.workSec;
            ct.phaseRemainingSec = ct.workSec;
            playWorkGoChime();
          } else if (ct.cooldownSec > 0) {
            ct.phase = 'COOLDOWN';
            ct.phaseTotalSec = ct.cooldownSec;
            ct.phaseRemainingSec = ct.cooldownSec;
            playRecoveryChime();
            showToast('Cool-down phase', 'info');
          } else {
            completeConditioningSession();
            return;
          }
        } else if (ct.phase === 'REST') {
          ct.currentRound += 1;
          ct.phase = 'WORK';
          ct.phaseTotalSec = ct.workSec;
          ct.phaseRemainingSec = ct.workSec;
          playWorkGoChime();
          showToast(`Round ${ct.currentRound}/${ct.totalRounds}: GO!`, 'success');
        } else if (ct.phase === 'COOLDOWN') {
          completeConditioningSession();
          return;
        }
      }

      if (state.currentTab === 'conditioning') {
        renderCurrentTab();
      }
    }

    function completeConditioningSession() {
      stopConditioningInterval();
      state.condTimer.active = false;
      state.condTimer.phase = 'DONE';
      state.condTimer.phaseRemainingSec = 0;
      playPRFanfare();
      showToast('Conditioning protocol complete!', 'pr');
      if (state.currentTab === 'conditioning') renderCurrentTab();
    }

    function logCompletedConditioningSession() {
      const ct = state.condTimer;
      state.conditioningLogs.unshift({
        id: 'cond_' + Date.now(),
        title: ct.protocolTitle,
        date: new Date().toISOString(),
        durationSeconds: ct.elapsedTotalSec,
        roundsCompleted: ct.currentRound,
        estimatedVO2: null,
        notes: ct.repCounter > 0 ? `${ct.repCounter} reps logged` : ''
      });
      saveConditioningLogs();
      resetConditioningTimer();
      showToast('Conditioning session saved!', 'success');
    }

    /**
     * ============================================================================
     * TAB 4: ENHANCED PR TRACKING, ANALYTICS & SESSION HISTORY
     * ============================================================================
     */
    function getExerciseSeriesData(exerciseId) {
      const chronological = [...state.history].reverse();
      const points = [];
      chronological.forEach(w => {
        const found = w.exercises.find(e => e.exerciseId === exerciseId);
        if (!found || !found.sets.length) return;
        let maxW = 0, maxR = 0, best1RM = 0, vol = 0;
        found.sets.forEach(s => {
          if (!s.completed) return;
          const wt = parseFloat(s.weight) || 0;
          const rp = parseInt(s.reps, 10) || 0;
          const e1 = calculateEpley1RM(wt, rp);
          if (wt > maxW) maxW = wt;
          if (rp > maxR) maxR = rp;
          if (e1 > best1RM) best1RM = e1;
          vol += wt * rp;
        });
        points.push({
          date: w.date,
          label: new Date(w.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }),
          maxWeight: maxW,
          maxReps: maxR,
          est1RM: best1RM,
          volume: Math.round(vol)
        });
      });
      return points;
    }

    function changeProgressExercise(id) {
      state.selectedProgressExerciseId = id;
      renderCurrentTab();
    }
    function changeProgressMetric(m) {
      state.progressMetric = m;
      renderCurrentTab();
    }
    function toggleHistoryExpand(id) {
      if (state.expandedHistoryIds.has(id)) state.expandedHistoryIds.delete(id);
      else state.expandedHistoryIds.add(id);
      renderCurrentTab();
    }
    function deleteHistoryEntry(id) {
      state.history = state.history.filter(w => w.id !== id);
      saveHistory();
      renderCurrentTab();
      showToast('Workout deleted.');
    }

    function drawProgressChart() {
      const wrapper = document.getElementById('chart-wrapper');
      if (!wrapper) return;
      const points = getExerciseSeriesData(state.selectedProgressExerciseId);
      if (points.length === 0) {
        wrapper.innerHTML = `<div class="h-full flex items-center justify-center text-xs text-slate-500">No sets logged for this exercise yet.</div>`;
        return;
      }

      const values = points.map(p =>
        state.progressMetric === '1rm' ? p.est1RM :
        state.progressMetric === 'maxWeight' ? p.maxWeight :
        state.progressMetric === 'maxReps' ? p.maxReps : p.volume
      );

      renderLineSVG(wrapper, points.map(p => p.label), values, '#10b981', '#06b6d4');
    }

    function drawWeeklyVolumeChart() {
      const wrapper = document.getElementById('weekly-volume-wrapper');
      if (!wrapper) return;

      // Group last 6 weeks of volume
      const weeks = [];
      const now = new Date();
      for (let i = 5; i >= 0; i--) {
        const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (i * 7 + 6));
        const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (i * 7) + 1);
        const vol = state.history
          .filter(w => {
            const d = new Date(w.date);
            return d >= start && d < end;
          })
          .reduce((sum, w) => sum + calculateWorkoutVolume(w), 0);
        weeks.push({
          label: start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }),
          vol
        });
      }

      const width = wrapper.clientWidth || 340;
      const height = 170;
      const maxVol = Math.max(...weeks.map(w => w.vol), 1000);
      const padBottom = 26;
      const padTop = 22;
      const plotH = height - padBottom - padTop;
      const colW = width / weeks.length;

      wrapper.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-full overflow-visible">
          ${weeks.map((wk, idx) => {
            const barH = Math.max(4, (wk.vol / maxVol) * plotH);
            const x = idx * colW + colW * 0.22;
            const barW = colW * 0.56;
            const y = padTop + plotH - barH;
            return `
              <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="6" fill="${wk.vol > 0 ? '#10b981' : '#1e293b'}" opacity="0.85" />
              <text x="${x + barW / 2}" y="${y - 6}" text-anchor="middle" fill="#cbd5e1" font-size="9" font-family="JetBrains Mono">
                ${wk.vol > 0 ? (wk.vol >= 1000 ? (wk.vol / 1000).toFixed(1) + 'k' : wk.vol) : '0'}
              </text>
              <text x="${x + barW / 2}" y="${height - 6}" text-anchor="middle" fill="#94a3b8" font-size="9">${wk.label}</text>
            `;
          }).join('')}
        </svg>
      `;
    }

    function renderLineSVG(wrapper, labels, values, lineColor = '#10b981', dotStroke = '#06b6d4') {
      const width = wrapper.clientWidth || 340;
      const height = 205;
      const padLeft = 42, padRight = 18, padTop = 22, padBottom = 28;
      const minVal = Math.min(...values);
      const maxVal = Math.max(...values);
      const range = maxVal - minVal || (maxVal * 0.15) || 5;
      const yMin = Math.max(0, minVal - range * 0.2);
      const yMax = maxVal + range * 0.2;
      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      const coords = values.map((val, i) => {
        const x = values.length === 1 ? padLeft + plotW / 2 : padLeft + (i / (values.length - 1)) * plotW;
        const y = padTop + plotH - ((val - yMin) / (yMax - yMin)) * plotH;
        return { x, y, val, label: labels[i] };
      });

      const poly = coords.map(c => `${c.x},${c.y}`).join(' ');
      const area = `${coords[0].x},${padTop + plotH} ${poly} ${coords[coords.length - 1].x},${padTop + plotH}`;
      const gradId = 'grad_' + Math.random().toString(36).slice(2, 7);

      const yTicks = [yMin, (yMin + yMax) / 2, yMax].map(v => ({
        val: Math.round(v * 10) / 10,
        y: padTop + plotH - ((v - yMin) / (yMax - yMin)) * plotH
      }));

      wrapper.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-full overflow-visible">
          <defs>
            <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${lineColor}" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="${lineColor}" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          ${yTicks.map(t => `
            <line x1="${padLeft}" y1="${t.y}" x2="${width - padRight}" y2="${t.y}" stroke="#1e293b" stroke-dasharray="3 3" stroke-width="1" />
            <text x="${padLeft - 6}" y="${t.y + 3}" text-anchor="end" fill="#94a3b8" font-size="9" font-family="JetBrains Mono">${t.val}</text>
          `).join('')}
          ${coords.length > 1 ? `<polygon points="${area}" fill="url(#${gradId})" />` : ''}
          ${coords.length > 1 ? `<polyline fill="none" stroke="${lineColor}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" points="${poly}" />` : ''}
          ${coords.map((c, idx) => `
            <circle cx="${c.x}" cy="${c.y}" r="4.5" fill="#090d16" stroke="${dotStroke}" stroke-width="2.5" />
            <text x="${c.x}" y="${c.y - 9}" text-anchor="middle" fill="#f8fafc" font-size="9.5" font-weight="bold" font-family="JetBrains Mono">${c.val}</text>
            ${(coords.length <= 6 || idx === 0 || idx === coords.length - 1) ? `
              <text x="${c.x}" y="${height - 6}" text-anchor="middle" fill="#94a3b8" font-size="9">${c.label}</text>
            ` : ''}
          `).join('')}
        </svg>
      `;
    }

    /**
     * ============================================================================
     * TAB 5: BODY WEIGHT & BMI TRACKER + SETTINGS / JSON BACKUP

    function getHeightInMeters() {
      if (state.settings.heightUnit === 'cm') {
        return (parseFloat(state.settings.heightCm) || 178) / 100;
      }
      const ft = parseFloat(state.settings.heightFeet) || 5;
      const inch = parseFloat(state.settings.heightInches) || 10;
      return ((ft * 12) + inch) * 0.0254;
    }

    function calculateBMI(weightVal) {
      const w = parseFloat(weightVal) || 0;
      if (w <= 0) return 0;
      const weightKg = state.settings.unit === 'kg' ? w : w * 0.45359237;
      const heightM = getHeightInMeters();
      if (heightM <= 0) return 0;
      return Math.round((weightKg / (heightM * heightM)) * 10) / 10;
    }

    function getBMICategory(bmi) {
      if (bmi <= 0) return { label: 'Enter Weight', color: 'text-slate-400', bg: 'bg-slate-800' };
      if (bmi < 18.5) return { label: 'Underweight', color: 'text-cyan-400', bg: 'bg-cyan-500' };
      if (bmi < 25.0) return { label: 'Normal Weight', color: 'text-emerald-400', bg: 'bg-emerald-500' };
      if (bmi < 30.0) return { label: 'Overweight', color: 'text-amber-400', bg: 'bg-amber-500' };
      return { label: 'Obese', color: 'text-rose-400', bg: 'bg-rose-500' };
    }

    function drawBodyWeightChart() {
      const wrapper = document.getElementById('bodyweight-chart-wrapper');
      if (!wrapper) return;
      const sorted = [...state.bodyLogs].sort((a, b) => a.date.localeCompare(b.date));
      if (sorted.length === 0) {
        wrapper.innerHTML = `<div class="h-full flex items-center justify-center text-xs text-slate-500">Log your first weigh-in above to track weight & BMI.</div>`;

    function exportDataJSON() {
      const payload = {
        app: 'IronLogPro',
        version: 2,
        exportedAt: new Date().toISOString(),
        settings: state.settings,
        exercises: state.exercises,
        templates: state.templates,
        history: state.history,
        conditioningLogs: state.conditioningLogs,
        bodyLogs: state.bodyLogs
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ironlog-pro-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Backup exported!', 'success');
    }

    function importDataJSON(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.history)) throw new Error('Invalid backup format.');
          state.history = parsed.history;
          if (Array.isArray(parsed.exercises)) state.exercises = parsed.exercises;
          if (Array.isArray(parsed.templates)) state.templates = parsed.templates;
          if (Array.isArray(parsed.conditioningLogs)) state.conditioningLogs = parsed.conditioningLogs;
          if (Array.isArray(parsed.bodyLogs)) state.bodyLogs = parsed.bodyLogs;
          if (parsed.settings) state.settings = { ...DEFAULT_SETTINGS, ...parsed.settings };
          state.hasSampleData = false;
          saveAllData();
          localStorage.setItem(STORAGE_KEYS.SAMPLE_FLAG, 'false');
          renderCurrentTab();
          showToast('Backup restored successfully!', 'success');
        } catch (err) {
          showToast('Import failed: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
    }

    function clearSampleData() {
      state.history = state.history.filter(w => !w.isSample);
      state.conditioningLogs = state.conditioningLogs.filter(c => !c.isSample);
      state.bodyLogs = state.bodyLogs.filter(b => !b.isSample);
      state.hasSampleData = false;
      saveAllData();
      localStorage.setItem(STORAGE_KEYS.SAMPLE_FLAG, 'false');
      renderCurrentTab();
      showToast('Sample data cleared!', 'success');
    }

    function resetAllLocalData() {
      Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
      state.history = [];
      state.conditioningLogs = [];
      state.bodyLogs = [];
      state.activeWorkout = null;
      state.templates = [...DEFAULT_TEMPLATES];
      state.exercises = [...DEFAULT_EXERCISES];
      state.settings = { ...DEFAULT_SETTINGS };
      state.hasSampleData = false;
      saveAllData();
      localStorage.setItem(STORAGE_KEYS.SAMPLE_FLAG, 'false');
      stopRestTimer(true);
      closeModal();
      updateHeaderState();
      renderCurrentTab();
      showToast('All data erased.');
    }

      const uthVO2 = Math.round((15.3 * (maxHR / restHR)) * 10) / 10;

              Save HR Estimate to Log

    function handleCooperVO2(e) {
      e.preventDefault();
      const meters = parseFloat(document.getElementById('cooper-meters').value) || 0;
      if (meters < 500) return;
      // Cooper formula: (meters - 504.9) / 44.73
      const vo2 = Math.round(((meters - 504.9) / 44.73) * 10) / 10;
      saveVO2Estimate(vo2, `Cooper 12-Min (${meters}m)`);
    }
